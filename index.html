<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoCall - Private Chat & Calls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <h2>🔒 CryptoCall</h2>
            <p>Private, End-to-End Encrypted Messaging & Calls</p>
            
            <div id="login-form">
                <input type="email" id="auth-email" placeholder="Email Address">
                <input type="password" id="auth-password" placeholder="Password">
                <button id="login-btn" class="btn primary">Log In / Sign Up</button>
            </div>
        </div>
    </div>

    <div id="app-screen" class="app-container hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar" id="my-avatar">U</div>
                    <span id="my-email-display">user@cryptocall.com</span>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search or type secret PIN...">
            </div>

            <div class="chat-list" id="chat-list">
                <div class="chat-item active" data-email="peer@cryptocall.com">
                    <div class="avatar">P</div>
                    <div class="chat-info">
                        <div class="chat-name">peer@cryptocall.com</div>
                        <div class="chat-preview">Click to chat privately...</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="chat-main">
            <div class="chat-header">
                <div class="active-contact-info">
                    <div class="avatar">P</div>
                    <div>
                        <h3 id="active-chat-email">peer@cryptocall.com</h3>
                        <span class="status-online">Online</span>
                    </div>
                </div>
<div class="active-contact-info">
            <button id="mobile-back-btn" class="icon-btn mobile-only hidden">⬅️</button>
            
            <div class="avatar">P</div>
            <div>
                <h3 id="active-chat-email">peer@cryptocall.com</h3>
                <span class="status-online">Online</span>
            </div>
        </div>
                <div class="header-actions">
                    <button id="start-call-btn" class="icon-btn" title="Start Video Call">📹</button>
                </div>
            </div>

            <div class="message-area" id="chat-messages">
                <div class="system-message">🔒 Messages are end-to-end encrypted. No call logs are saved.</div>
            </div>

            <div class="chat-input-container">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button id="send-btn" class="btn primary">Send</button>
            </div>
        </main>
    </div>

    <div id="video-overlay" class="video-overlay hidden">
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>

            <video id="local-video" autoplay playsinline muted></video>

            <div class="call-controls">
                <button id="mic-btn" class="ctrl-btn">🎤 Mute</button>
                <button id="cam-btn" class="ctrl-btn">📷 Cam Off</button>
                <button id="end-call-btn" class="ctrl-btn danger">📞 End Call</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
